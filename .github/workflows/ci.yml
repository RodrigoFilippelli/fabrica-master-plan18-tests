name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test synthetic application
        run: dotnet test tests/Homolog.Fixture.Tests/Homolog.Fixture.Tests.csproj --configuration Release
      - name: Build container without publishing
        run: docker build --tag plan18-fixture:ci .
      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run --detach --publish 127.0.0.1::8080 plan18-fixture:ci)
          trap 'docker rm --force "$container" >/dev/null' EXIT
          port=$(docker port "$container" 8080/tcp | cut -d: -f2)
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 --retry-max-time 30 "http://127.0.0.1:$port/health" > health.json
          python3 -c 'import json; assert json.load(open("health.json")) == {"status":"healthy","service":"plan18-synthetic-fixture"}'

  image:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image reference
        id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ref.outputs.image }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
